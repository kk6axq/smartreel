; PlatformIO Project Configuration File
;
; Target: Waveshare ESP32-S3-Touch-LCD-4.3B
;   MCU       : ESP32-S3-WROOM-1-N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
;   LCD       : 800 x 480, 16-bit RGB565 parallel (ST7262-style timing)
;   Touch     : GT911 capacitive (I2C, addr 0x5D / 0x14)
;   I/O Expdr : CH422G on I2C - drives LCD reset, backlight, touch reset

; The upstream espressif32 PlatformIO platform is pinned to
; arduino-esp32 2.0.x / ESP-IDF 4.4. We use pioarduino's fork to get
; arduino-esp32 3.x / IDF 5.3, which unlocks bounce buffers (proper
; tearing fix on RGB LCDs), num_fbs=2, and esp_vfs_fat_sdcard_format.
[env:waveshare_esp32s3_43b]
platform              = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board                 = esp32-s3-devkitc-1
framework             = arduino

; ---- Board build options ----------------------------------------------------
board_build.mcu                 = esp32s3
board_build.f_cpu               = 240000000L
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

; ---- Serial / upload --------------------------------------------------------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 460800
upload_flags    = --no-stub

; ---- Build flags ------------------------------------------------------------
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; HMI firmware version (shown in the Firmware screen + 'fwinfo').
    -DFW_VER_MAJOR=1
    -DFW_VER_MINOR=0
    -DFW_VER_PATCH=0
    ; LVGL config lookup
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
    -I include
    -I src
    ; arduino-esp32 v3.x bundles Network as a sibling of WiFi but
    ; PIO's LDF doesn't propagate include paths between bundled libs,
    ; so we add Network's header path explicitly.
    -I "$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src"

; ---- Libraries --------------------------------------------------------------
; LVGL + ArduinoJson from the registry. The display + touch + IO-
; expander drivers are written in-tree against esp_lcd / Wire so we
; are not at the mercy of fast-moving wrapper libs.
;
; Network + NetworkClientSecure: arduino-esp32 v3 split the network
; stack so WiFi depends on these. They ship bundled with the
; framework, NOT on the PIO registry. Listing them here is what tells
; PIO to compile their .cpp files into the build -- without them the
; link step fails with "undefined reference to NetworkInterface::*".
; PIO will print a cosmetic "Could not find the package with
; 'Network' requirements" warning during dependency resolution
; because it queries the registry first; it then falls back to the
; bundled framework lib and everything works. Ignore the warning.
lib_ldf_mode = chain+
lib_deps =
    lvgl/lvgl @ ~8.4.0
    bblanchon/ArduinoJson @ ^7.1.0
    Network
    NetworkClientSecure
