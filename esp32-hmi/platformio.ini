; PlatformIO Project Configuration File
;
; Target: Waveshare ESP32-S3-Touch-LCD-4.3B
;   MCU       : ESP32-S3-WROOM-1-N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
;   LCD       : 800 x 480, 16-bit RGB565 parallel (ST7262-style timing)
;   Touch     : GT911 capacitive (I2C, addr 0x5D / 0x14)
;   I/O Expdr : CH422G on I2C - drives LCD reset, backlight, touch reset

; The upstream espressif32 PlatformIO platform is pinned to
; arduino-esp32 2.0.x / ESP-IDF 4.4. We use pioarduino's fork to get
; arduino-esp32 3.x / IDF 5.3, which unlocks bounce buffers (proper
; tearing fix on RGB LCDs), num_fbs=2, and esp_vfs_fat_sdcard_format.
[env:waveshare_esp32s3_43b]
platform              = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board                 = esp32-s3-devkitc-1
framework             = arduino

; ---- Board build options ----------------------------------------------------
board_build.mcu                 = esp32s3
board_build.f_cpu               = 240000000L
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

; ---- Serial / upload --------------------------------------------------------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 460800
upload_flags    = --no-stub

; ---- Build flags ------------------------------------------------------------
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; LVGL config lookup
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
    -I include
    -I src
    ; arduino-esp32 v3.x bundles Network as a sibling of WiFi but
    ; PIO's LDF doesn't propagate include paths between bundled libs,
    ; so we add Network's header path explicitly.
    -I "$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src"

; ---- Libraries --------------------------------------------------------------
; Just LVGL. The display + touch + IO-expander drivers are written in-tree
; against esp_lcd / Wire so we are not at the mercy of fast-moving wrapper libs.
;
; arduino-esp32 v3.x split the network stack: WiFi depends on
; bundled libraries Network and NetworkClientSecure that the LDF
; doesn't auto-discover, so we name them explicitly.
; chain+ follows #includes from project sources and lib_deps. Faster
; than deep+ because it doesn't pre-parse every header in every
; bundled Arduino library. The explicit -I path to Network/src above
; is what makes it work despite arduino-esp32 v3's split network stack.
lib_ldf_mode = chain+
lib_deps =
    lvgl/lvgl @ ~8.4.0
    bblanchon/ArduinoJson @ ^7.1.0
    Network
    NetworkClientSecure
