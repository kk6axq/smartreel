; =====================================================================
;  SmartReel Core -- RS485 slave test firmware for the RP2040.
;
;  This is a *bench validation* build, not the production core firmware.
;  It implements the RS485 slave side of docs/smartreel-rs485-protocol.md
;  (PING / GET_VERSION / GET_STATUS / POLL / reel I/O / LED ack / event
;  queue) so the ESP32 HMI's master + UI plumbing can be exercised
;  end-to-end with no reel hardware attached.
;
;  Fake reel events are injected over the USB serial console -- type
;  'help' on the USB CDC port for the command list.
;
;  Wiring (RP2040 <-> SP3485, per the user's bench rig, matching the
;  Core PCB):
;      SP3485 RO    -> GPIO17  (UART0 RX, data the RP2040 receives)
;      SP3485 DI    -> GPIO16  (UART0 TX, data the RP2040 sends)
;      SP3485 DE+RE# -> GPIO18 (driver enable; HIGH = transmit)
;
;  The RS485 wire protocol sources (crc16 + frame codec) are shared
;  verbatim with the ESP32 firmware via a symlink at src/rs485 ->
;  ../../esp32-hmi/src/rs485. We compile crc16.cpp + rs485_frame.cpp
;  but exclude rs485.cpp (that's the ESP-IDF master implementation).
; =====================================================================

[env:pico]
platform   = https://github.com/maxgerhardt/platform-raspberrypi.git
board      = pico
framework  = arduino
board_build.core = earlephilhower

; USB CDC console for fake-event injection + diagnostics.
monitor_speed = 115200

; A fresh board (or one held in BOOTSEL) flashes via UF2 mass storage;
; picotool auto-detects either a BOOTSEL drive or a running board that
; supports the reset-to-bootloader vendor request.
upload_protocol = picotool

build_flags =
    -I src                  ; so "rs485/..." headers resolve via the symlink
    -DSMARTREEL_CORE_TESTRIG=1

; Compile main.cpp + the shared crc16/frame codec, but NOT the ESP-IDF
; master (rs485.cpp), which won't build for the RP2040.
build_src_filter =
    +<*>
    -<rs485/rs485.cpp>
