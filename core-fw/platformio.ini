; =====================================================================
;  SmartReel Core -- PRODUCTION firmware for the RP2040.
;
;  The real core firmware: drives the Core PCB slot hardware (WS2812B
;  LEDs via NeoPXL8 PIO+DMA, ADS1115 reel-sense, 74HC165 inputs -- see
;  src/config.h + src/reel_hw.*) and speaks the RS485 slave side of
;  docs/smartreel-rs485-protocol.md to the ESP32 HMI bus master
;  (PING / GET_VERSION / GET_STATUS / POLL / reel I/O / LED control /
;  event queue / firmware update).
;
;  Pin map (RP2040, all GP## indices -- see src/config.h):
;      LEDs (WS2812B data)   GP6/7/8/9        ports 0-3
;      ADS1115 (I2C0)        SDA=GP0 SCL=GP1  AIN0-3 = port sense
;      74HC165 inputs        SCK=GP10 LATCH=GP11 DIN=GP12/13/14/15
;      RS485 (SP3485, UART0) DI=GP16 RO=GP17 DE+RE#=GP18
;      debug LEDs            GP2 (RS485 link) GP3 (activity)
;
;  The RS485 wire protocol sources (crc16 + frame codec) are shared
;  verbatim with the ESP32 firmware via a symlink at src/rs485 ->
;  ../../esp32-hmi/src/rs485. We compile crc16.cpp + rs485_frame.cpp
;  but exclude rs485.cpp (that's the ESP-IDF master implementation).
; =====================================================================

[env:pico]
platform   = https://github.com/maxgerhardt/platform-raspberrypi.git
board      = pico
framework  = arduino
board_build.core = earlephilhower

; Reserve a LittleFS region for OTA staging. The RS485 firmware-update
; receiver writes the incoming image to LittleFS ("firmware.bin") via the
; Updater lib; on reboot the core's OTA bootloader flashes it. 1 MB is
; ample for the core image and leaves >1 MB for app + bootloader.
board_build.filesystem_size = 1m

; USB CDC diagnostic console.
monitor_speed = 115200

; LED + ADC drivers. NeoPXL8 drives all four WS2812B data lines in
; parallel via the RP2040 PIO + DMA (non-blocking -- never disables
; interrupts, so it can't corrupt an in-flight RS485 frame).
lib_deps =
    adafruit/Adafruit NeoPXL8
    adafruit/Adafruit ADS1X15

; A fresh board (or one held in BOOTSEL) flashes via UF2 mass storage;
; picotool auto-detects either a BOOTSEL drive or a running board that
; supports the reset-to-bootloader vendor request.
upload_protocol = picotool

build_flags =
    -I src                  ; so "rs485/..." headers resolve via the symlink
    ; Core firmware version (shown by 'ver', GET_VERSION, and the HMI UI).
    -DFW_VER_MAJOR=1
    -DFW_VER_MINOR=0
    -DFW_VER_PATCH=0

; Compile main.cpp + the shared crc16/frame codec, but NOT the ESP-IDF
; master (rs485.cpp), which won't build for the RP2040.
build_src_filter =
    +<*>
    -<rs485/rs485.cpp>
