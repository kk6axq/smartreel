; =====================================================================
;  SmartReel Core -- HARDWARE bring-up test (RP2040)
;
;  Standalone, throwaway test firmware that talks DIRECTLY to the slot
;  hardware -- no RS485, no protocol. Use it to confirm the Core PCB is
;  alive before wiring any of this into the real core firmware:
;     - WS2812B LEDs   on GPIO6/7/8/9   (slots 1-4)
;     - ADS1115 ADC    on I2C0 GPIO0(SDA)/GPIO1(SCL), AIN0-3 = reel
;       detect 1-4 (2.2k pullup to 3.3V, 10k pulldown per inserted reel)
;     - 74HC165 PISO   shared SCK=GPIO10 / LATCH=GPIO11, DIN=GPIO12/13/14/15
;
;  Everything streams to the USB CDC console (115200). Type 'help'.
; =====================================================================

[env:pico]
platform   = https://github.com/maxgerhardt/platform-raspberrypi.git
board      = pico
framework  = arduino
board_build.core = earlephilhower

monitor_speed = 115200

; A fresh board (or one held in BOOTSEL) flashes via UF2 mass storage;
; picotool auto-detects either a BOOTSEL drive or a running board.
upload_protocol = picotool

lib_deps =
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit ADS1X15
