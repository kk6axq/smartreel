; =====================================================================
;  ESP32-S3 RS485 pin-toggle bench tool (standalone)
;
;  Minimal firmware that does nothing but slowly toggle the RS485 TX
;  pin (GPIO16) so it can be followed on a multimeter. GPIO16 drives the
;  HMI's auto-direction transistor:
;     GPIO16 HIGH -> transistor on  -> DE/RE low  -> driver OFF
;                    -> bus idles to bias mark (A>B, ~+3.8V)
;     GPIO16 LOW  -> transistor off -> DE/RE high -> driver ON, DI=GND
;                    -> bus actively driven to space (A<B, negative)
;
;  So if the SP3485 + auto-direction work, A-B should flip sign each
;  time GPIO16 toggles. No display / touch / LVGL -- just the pin.
;
;  Same board/USB settings as esp32-hmi so the dl-mode upload flow and
;  USB-CDC console work identically.
; =====================================================================
[env:waveshare_esp32s3_43b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board    = esp32-s3-devkitc-1
framework = arduino

board_build.mcu                 = esp32s3
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

monitor_speed = 115200
upload_speed  = 460800
upload_flags  = --no-stub

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
